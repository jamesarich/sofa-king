# The notes of the rolling `snapshot` release, rendered by git-cliff from the squash-merge titles on `main`, which are
# Conventional Commits. `publish-snapshot.yml` runs it over the commits since the previous snapshot. Only `feat`, `fix`
# and `perf` reach the notes; tests, CI, docs and Renovate's `build(deps)` updates do not. The lines stay plain text
# (GitHub links the `(#123)` itself), since the app's update check reads them too: keep the `New` and `Fixes` group
# names and the `- scope: summary` shape in step with `UpdateChecker.releaseNotes`.

[changelog]
body = """
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{% for commit in commits %}
- {% if commit.scope %}{{ commit.scope }}: {% endif %}{{ commit.message | upper_first }}
{%- endfor %}
{% endfor %}
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
filter_commits = true
sort_commits = "newest"
commit_parsers = [
  { message = "^feat", group = "<!-- 0 -->New" },
  { message = "^(fix|perf)", group = "<!-- 1 -->Fixes" },
  { message = ".*", skip = true },
]
