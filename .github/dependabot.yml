# Weekly version updates. Dependabot edits the catalog, the wrappers, the workflow actions and the server's base images;
# the lockfiles workflow (lockfiles.yml) then rewrites every build's lockfiles and verification metadata on the same
# branch, because Dependabot cannot resolve the app's Android, Apple and web configurations itself.
# A dependency on a prerelease (Kotlin, the Android Gradle plugin, Compose Multiplatform, kotlinx.serialization,
# the Gradle milestone) is offered newer prereleases; one on a release is offered releases only.
version: 2

updates:
  # The root directory finds the shared catalog, gradle/libs.versions.toml. The builds' own directories hold their
  # wrappers and the settings plugins pinned outside the catalog, and group-by joins the same bump across them.
  - package-ecosystem: gradle
    directories: ["/", "/app", "/backend", "/contract"]
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: build
      include: scope
    open-pull-requests-limit: 5
    groups:
      # Preview pins outside the published compatibility matrices; a bump of one usually needs the others.
      kotlin-agp-compose:
        patterns:
          - "org.jetbrains.kotlin*"
          - "com.android*"
          - "org.jetbrains.compose*"
        exclude-patterns: ["org.jetbrains.kotlinx*"]
      gradle-wrapper:
        patterns: ["gradle-wrapper"]
        group-by: dependency-name
      settings-plugins:
        patterns: ["org.gradle.toolchains.foojay-resolver-convention*"]
        group-by: dependency-name
      libraries:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: "/backend"
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: build
      include: scope
    groups:
      base-images:
        patterns: ["*"]
