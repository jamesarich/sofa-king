name: Backend

# Tests every pull request and push that changes the server's or the contract's code or build, the shared Gradle settings,
# version catalog and build-logic, or this workflow; backend/docs and Markdown are left out. The image carries the web app
# built from the same commit, so a push to main that changes the app's core or ui module or its build publishes it too;
# app pull requests are checked by ci.yml. A push to main, or a manual run on main,
# then publishes the server image for linux/amd64 and linux/arm64 to GitHub Container Registry as
# ghcr.io/<owner>/sofa-king:main and :sha-<commit>, with a BuildKit SBOM and max-mode provenance stored beside it, a
# keyless cosign signature and a GitHub build attestation.
# Each platform builds on a native runner and pushes by digest, and one job joins the digests under the tags.
# A pull request builds both platforms and pushes nothing.
# Hosts that run deploy/sofa-king-update.sh pull :main, so Markdown alone never redeploys them. A `v*` tag, which
# release.yml publishes the app for, publishes the same image as :X.Y.Z, :X.Y and :latest instead of :main; path filters
# do not apply to tags.
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "app/core/**"
      - "app/ui/**"
      - "app/build.gradle.kts"
      - "app/settings.gradle.kts"
      - "app/gradle.properties"
      - "!app/**/*.md"
      - "backend/**"
      - "!backend/docs/**"
      - "!backend/**/*.md"
      - "contract/**"
      - "!contract/**/*.md"
      - "gradle/**"
      - ".editorconfig"
      - "build-logic/**"
      - "!build-logic/**/*.md"
      - ".github/workflows/backend.yml"
      - ".github/version.sh"
      - ".github/actions/apt-install/**"
  pull_request:
    paths:
      - "backend/**"
      - "!backend/docs/**"
      - "!backend/**/*.md"
      - "contract/**"
      - "!contract/**/*.md"
      - "gradle/**"
      - ".editorconfig"
      - "build-logic/**"
      - "!build-logic/**/*.md"
      - ".github/workflows/backend.yml"
      - ".github/version.sh"
      - ".github/actions/apt-install/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-${{ github.ref }}
  # A push to main publishes the image, so only pull request runs are canceled.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  SOFAKING_CACHE_USERNAME: ${{ secrets.SOFAKING_CACHE_USERNAME }}
  SOFAKING_CACHE_PASSWORD: ${{ secrets.SOFAKING_CACHE_PASSWORD }}
  SOFAKING_CACHE_PUSH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

defaults:
  run:
    working-directory: backend

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      # The tests generate HLS fixtures with FFmpeg and run Comskip on a generated recording.
      - name: Install FFmpeg and Comskip
        uses: ./.github/actions/apt-install
        with:
          packages: ffmpeg comskip

      - name: Check the formatting, analyze, test and build the distribution
        run: ./gradlew --console=plain spotlessCheck detekt test :server:installDist

      # The contract is an included build, so the server's test task does not run its tests: the wire fixtures that
      # older apps rely on are only checked here.
      - name: Test the contract
        working-directory: contract
        run: ./gradlew --console=plain spotlessCheck detekt jvmTest

      # The deploy and smoke scripts have no Gradle task; the runner image ships shellcheck.
      - name: Check the shell and Python tooling
        run: |
          shellcheck deploy/*.sh scripts/*.sh
          python3 -I -m unittest discover -s scripts -p 'test_*.py'

      # Both start the installed distribution in a temporary directory and talk to it only over loopback: smoke.py checks
      # the HTTP routes, the migrations and SIGTERM across a restart; live-smoke.py serves fixture feeds and guides it
      # generates with FFmpeg and decodes video through the relay, the player output and the HDHomeRun remux. An empty
      # SOFA_UPDATE_IMAGE turns off the update check, so the server reaches no registry either.
      - name: Smoke test the distribution
        timeout-minutes: 3
        env:
          SOFA_UPDATE_IMAGE: ""
        run: python3 scripts/smoke.py

      - name: Smoke test live TV against local fixtures
        timeout-minutes: 5
        env:
          SOFA_UPDATE_IMAGE: ""
        run: python3 scripts/live-smoke.py

      # Schemathesis sends generated requests to every documented route of a fresh server and fails on a 5xx, a
      # response that breaks the OpenAPI document, or a server that stops answering.
      - name: Fuzz the API against its OpenAPI document
        timeout-minutes: 10
        env:
          SOFA_UPDATE_IMAGE: ""
        run: |
          pipx install schemathesis==4.32.4
          python3 scripts/api-fuzz.py

      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports
          path: "backend/**/build/reports/tests"
          retention-days: 14

      # Artifacts drop file modes, so the distribution travels as a tar to keep bin/server executable.
      - name: Pack the distribution
        run: tar -C server/build/install -cf server-dist.tar server

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: server-dist
          path: backend/server-dist.tar
          retention-days: 1
          if-no-files-found: error

  # Comskip built from source on Ubuntu 26.04, which ships FFmpeg 8 and no comskip package, then the one test class that
  # runs it. The binary is cached on the build script (which holds the pinned commit) and the patch.
  comskip:
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      # The -dev packages bring the shared libraries the built binary links against.
      - name: Install FFmpeg and the Comskip build dependencies
        uses: ./.github/actions/apt-install
        with:
          packages: ffmpeg build-essential autoconf automake libtool pkg-config libargtable2-dev libavformat-dev libavcodec-dev libavutil-dev libswscale-dev

      - id: cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/comskip
          key: comskip-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('backend/scripts/build-comskip.sh', 'backend/comskip/ffmpeg-8.patch') }}

      - name: Build Comskip
        if: steps.cache.outputs.cache-hit != 'true'
        timeout-minutes: 10
        run: scripts/build-comskip.sh "$HOME/comskip"

      - name: Put Comskip on the path and run it
        run: |
          echo "$HOME/comskip/bin" >> "$GITHUB_PATH"
          "$HOME/comskip/bin/comskip" --help 2>&1 | head -n 3 || true
          ffmpeg -version | head -n 1

      # The test skips when comskip does not start, so the report must show it ran.
      - name: Run the Comskip test
        run: |
          ./gradlew --console=plain :server:test --tests 'dev.jamesrich.sofaking.backend.dvr.CommercialsTest'
          grep -q 'name="Comskip finds the ad block in a generated recording()"' server/build/test-results/test/TEST-dev.jamesrich.sofaking.backend.dvr.CommercialsTest.xml
          ! grep -q '<skipped' server/build/test-results/test/TEST-dev.jamesrich.sofaking.backend.dvr.CommercialsTest.xml

      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: comskip-test-reports
          path: "backend/**/build/reports/tests"
          retention-days: 14

  # The web app the image serves at /app/, built with the version the image carries. It runs beside the tests, and the
  # remote build cache answers it when the app has not changed.
  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The version counts the commits behind HEAD.
          fetch-depth: 0

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: true
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Build the web app
        run: |
          eval "$(../.github/version.sh | grep -E '^(code|suffix)=')"
          ./gradlew --console=plain "-Psofaking.versionCode=$code" "-Psofaking.versionSuffix=$suffix" :ui:wasmJsBrowserDistribution

      # The server sends a .gz beside a file to a browser that takes gzip, so the NAS never compresses the bundle itself.
      # Source maps stay out of the image.
      - name: Pack the web app
        run: |
          mkdir -p "$RUNNER_TEMP/web"
          cp -R ui/build/dist/wasmJs/productionExecutable/. "$RUNNER_TEMP/web/"
          rm -f "$RUNNER_TEMP"/web/*.map
          find "$RUNNER_TEMP/web" -type f \( -name '*.wasm' -o -name '*.js' -o -name '*.css' -o -name '*.html' -o -name '*.cvr' -o -name '*.json' -o -name '*.webmanifest' -o -name '*.svg' \) -exec gzip -9 -k -n {} +
          tar -C "$RUNNER_TEMP" -cf "$GITHUB_WORKSPACE/web.tar" web

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-app
          path: web.tar
          retention-days: 1
          if-no-files-found: error

  image:
    name: Image (${{ matrix.arch }})
    needs: [test, web]
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ steps.names.outputs.version }}
    env:
      PUBLISH: ${{ (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The version counts the commits behind HEAD.
          fetch-depth: 0

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: server-dist
          path: backend

      - name: Unpack the distribution
        run: mkdir -p server/build/install && tar -C server/build/install -xf server-dist.tar

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-app
          path: backend

      - name: Unpack the web app
        run: tar -xf web.tar

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - if: env.PUBLISH == 'true'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Name the image
        id: names
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/sofa-king" >> "$GITHUB_OUTPUT"
          echo "revision=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          # The same version as the app's snapshot built from this commit.
          ../.github/version.sh | grep '^version=' >> "$GITHUB_OUTPUT"

      # Each platform keeps its own layer cache; main writes it and pull requests read it.
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: backend
          platforms: linux/${{ matrix.arch }}
          build-args: |
            REVISION=${{ steps.names.outputs.revision }}
            VERSION=${{ steps.names.outputs.version }}
          outputs: type=image,name=${{ steps.names.outputs.image }},push-by-digest=true,name-canonical=true,push=${{ env.PUBLISH }}
          sbom: ${{ env.PUBLISH == 'true' }}
          provenance: ${{ env.PUBLISH == 'true' && 'mode=max' || 'false' }}
          cache-from: type=gha,scope=backend-${{ matrix.arch }}
          cache-to: ${{ env.PUBLISH == 'true' && format('type=gha,scope=backend-{0},mode=min', matrix.arch) || '' }}

      # The same build again from the builder's cache, loaded into the runner's Docker, so the image runs before main is
      # tagged.
      - name: Load the image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: backend
          platforms: linux/${{ matrix.arch }}
          build-args: |
            REVISION=${{ steps.names.outputs.revision }}
            VERSION=${{ steps.names.outputs.version }}
          load: true
          tags: sofa-king:check
          provenance: false
          cache-from: type=gha,scope=backend-${{ matrix.arch }}

      - name: Start the image and check its health
        timeout-minutes: 3
        run: |
          docker run --detach --name sofa-king --publish 127.0.0.1:8080:8080 sofa-king:check
          until curl -fs http://127.0.0.1:8080/readyz > /dev/null; do
            test "$(docker inspect --format '{{.State.Running}}' sofa-king)" = true
            sleep 1
          done
          test "$(curl -fsS http://127.0.0.1:8080/healthz)" = ok
          # The web app: the page, and its WebAssembly as such, precompressed.
          curl -fsS http://127.0.0.1:8080/app/ | grep -q '<title>Sofa King</title>'
          wasm="$(docker exec sofa-king sh -c 'cd /opt/sofa/web && ls *.wasm | head -1')"
          curl -fsS -o /dev/null -D - -H 'Accept-Encoding: gzip' "http://127.0.0.1:8080/app/$wasm" | tee /dev/stderr | grep -qi '^content-encoding: gzip'
          # The tuners are on and admit nobody until an address is allowed.
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/discover.json)" = 403
          # The image's own health check, run inside the container.
          docker exec sofa-king sh -c 'curl -fsS "http://127.0.0.1:${SOFA_PORT}/readyz"'
          docker stop --timeout 15 sofa-king
          code="$(docker inspect --format '{{.State.ExitCode}}' sofa-king)"
          test "$code" = 0 || test "$code" = 143

      - if: failure()
        name: Show the container log
        run: docker logs sofa-king || true

      - if: env.PUBLISH == 'true'
        name: Record the digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"

      - if: env.PUBLISH == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          retention-days: 1
          if-no-files-found: error

  publish:
    needs: image
    if: (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
      # Keyless signing and the build attestation take the run's OpenID Connect identity.
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digest-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Each platform's index carries its SBOM and provenance, and the joined index keeps them. The index annotations
      # repeat the image labels, which the registry reads from the index rather than from a platform's config.
      - name: Tag the multi-platform image
        id: index
        working-directory: ${{ runner.temp }}/digests
        env:
          VERSION: ${{ needs.image.outputs.version }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/sofa-king"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tags=(--tag "$image:$VERSION" --tag "$image:${VERSION%.*}" --tag "$image:latest")
          else
            tags=(--tag "$image:main")
          fi
          docker buildx imagetools create \
            "${tags[@]}" \
            --tag "$image:sha-${GITHUB_SHA::7}" \
            --annotation "index:org.opencontainers.image.title=Sofa King server" \
            --annotation "index:org.opencontainers.image.description=Self-hosted media center server: live TV from free streaming services, tuners and playlists in one lineup, a DVR with commercial detection, and movie and TV libraries converted on the fly; also an HDHomeRun tuner for Plex" \
            --annotation "index:org.opencontainers.image.source=https://github.com/jamesarich/sofa-king" \
            --annotation "index:org.opencontainers.image.licenses=GPL-3.0-only" \
            --annotation "index:org.opencontainers.image.revision=${GITHUB_SHA::7}" \
            --annotation "index:org.opencontainers.image.version=$VERSION" \
            $(printf "$image@sha256:%s " *)
          docker buildx imagetools inspect "$image:sha-${GITHUB_SHA::7}"
          digest=$(docker buildx imagetools inspect "$image:sha-${GITHUB_SHA::7}" --format '{{json .Manifest}}' | jq -r .digest)
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      # Signs the joined index by its digest, so every tag above carries the one signature. `cosign verify` checks it
      # against this workflow's identity, as deploy.md shows.
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign the image
        # This job has no checkout, so the workflow's default backend/ folder does not exist.
        working-directory: ${{ runner.temp }}
        env:
          REF: ${{ steps.index.outputs.image }}@${{ steps.index.outputs.digest }}
        run: cosign sign --yes "$REF"

      # A GitHub build attestation beside the signature, for `gh attestation verify oci://…`.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.index.outputs.image }}
          subject-digest: ${{ steps.index.outputs.digest }}
          push-to-registry: true
