name: CI

# The app's code and build, and the contract it shares with the server; Markdown alone does not run it.
on:
  pull_request:
    paths:
      - "app/**"
      - "!app/docs/**"
      - "!app/**/*.md"
      - "contract/**"
      - "!contract/**/*.md"
      - "gradle/**"
      - "build-logic/**"
      - "!build-logic/**/*.md"
      - ".github/workflows/ci.yml"
      - ".github/workflows/snapshot.yml"
      - ".github/workflows/publish-snapshot.yml"
      - ".github/version.sh"
  push:
    branches: [main]
    paths:
      - "app/**"
      - "!app/docs/**"
      - "!app/**/*.md"
      - "contract/**"
      - "!contract/**/*.md"
      - "gradle/**"
      - "build-logic/**"
      - "!build-logic/**/*.md"
      - ".github/workflows/ci.yml"
      - ".github/workflows/snapshot.yml"
      - ".github/workflows/publish-snapshot.yml"
      - ".github/version.sh"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  SOFAKING_CACHE_USERNAME: ${{ secrets.SOFAKING_CACHE_USERNAME }}
  SOFAKING_CACHE_PASSWORD: ${{ secrets.SOFAKING_CACHE_PASSWORD }}
  SOFAKING_CACHE_PUSH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

defaults:
  run:
    working-directory: app

jobs:
  check:
    name: Test and build (Linux)
    runs-on: ubuntu-24.04
    # The build takes about ten minutes and the web key fuzz about five more; the limit bounds a hung cache save, which
    # once ran for 42 minutes until canceled by hand and kept the next main run queued behind it. FFmpeg's packages
    # once took 19 minutes from the runner's mirror.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
          # The key encrypts configuration-cache data, which setup-gradle 6 stores only for a Develocity trial; until
          # then every run configures from scratch.
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
      # The Kotlin/Native distribution and its toolchains, kept per Kotlin version. Keyed on the whole catalog, any
      # dependency bump restarted it cold, which cost the Apple job ten extra minutes per pull request until main saved.
      - name: Read the Kotlin version
        id: kotlin
        working-directory: gradle
        run: echo "version=$(sed -n 's/^kotlin = "\(.*\)"$/\1/p' libs.versions.toml)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ steps.kotlin.outputs.version }}
          restore-keys: konan-${{ runner.os }}-
      - name: Test, lint and build
        run: >-
          ./gradlew --continue
          :core:allTests :ui:jvmTest :ui:testAndroidHostTest :ui:jsNodeTest
          :core:compileTestKotlinLinuxX64 :core:compileKotlinLinuxArm64 :ui:compileTestKotlinIosSimulatorArm64
          :androidApp:lintDebug :androidApp:assembleRelease :androidApp:testDebugScreenshotTestDefaultTestSuite
          :ui:wasmJsBrowserDistribution :ui:jsBrowserDistribution
      # Random keys on both production web builds in Google Chrome, which the runner has and which plays the fixture
      # channels' H.264 where Playwright's own Chromium does not, against the server's distribution, as on the TV.
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Build the server distribution
        working-directory: backend
        run: ./gradlew --console=plain :server:installDist
      - name: Install Playwright
        run: |
          python3 -m venv build/playwright
          build/playwright/bin/pip install playwright==1.56.0
      - name: Press random keys on the web app
        run: |
          status=0
          for target in wasmJs js; do
            build/playwright/bin/python scripts/web-fuzz.py --channel chrome \
              --dist "ui/build/dist/$target/productionExecutable" --out "build/web-fuzz/$target" || status=1
          done
          exit "$status"
      # A restored older distribution would otherwise be saved again under the new key, and the entry would grow.
      - name: Keep only the current Kotlin/Native distribution
        if: github.ref == 'refs/heads/main'
        env:
          VERSION: ${{ steps.kotlin.outputs.version }}
        run: find ~/.konan -maxdepth 1 -name 'kotlin-native-prebuilt-*' -not -name "*-$VERSION" -exec rm -rf {} +
      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports-linux
          path: |
            app/*/build/reports/
            app/*/build/test-results/
            app/ui/build/fuzz/
            app/ui/build/journeys/
            app/build/web-fuzz/
      - name: Upload render screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screenshots
          path: app/ui/build/screenshots/
          if-no-files-found: ignore

  # Apple targets and the two Swift hosts, which only macOS can build.
  apple:
    name: Test (Apple)
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
          # The key encrypts configuration-cache data, which setup-gradle 6 stores only for a Develocity trial; until
          # then every run configures from scratch.
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
      # The Kotlin/Native distribution and its toolchains, kept per Kotlin version. Keyed on the whole catalog, any
      # dependency bump restarted it cold, which cost the Apple job ten extra minutes per pull request until main saved.
      - name: Read the Kotlin version
        id: kotlin
        working-directory: gradle
        run: echo "version=$(sed -n 's/^kotlin = "\(.*\)"$/\1/p' libs.versions.toml)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ steps.kotlin.outputs.version }}
          restore-keys: konan-${{ runner.os }}-
      # The device targets cannot run tests here, so they only compile.
      - name: Test Apple targets, compile the device targets and link the iOS and tvOS frameworks
        run: >-
          ./gradlew --continue
          :core:iosSimulatorArm64Test :core:macosArm64Test :core:tvosSimulatorArm64Test
          :core:watchosSimulatorArm64Test :ui:iosSimulatorArm64Test
          :core:compileKotlinIosArm64 :core:compileKotlinTvosArm64 :core:compileKotlinWatchosArm64
          :ui:compileKotlinIosArm64
          :ui:linkDebugFrameworkIosSimulatorArm64 :core:linkDebugFrameworkTvosSimulatorArm64
      # The SwiftUI hosts compile against the frameworks linked above; their pre-build script reuses that Gradle work.
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Build the iOS host
        working-directory: app/iosApp
        run: >-
          xcodegen && xcodebuild -project SofaKing.xcodeproj -scheme SofaKing -configuration Debug
          -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO -quiet build
      - name: Build the Apple TV host
        working-directory: app/tvosApp
        run: >-
          xcodegen && xcodebuild -project SofaKingTV.xcodeproj -scheme SofaKingTV -configuration Debug
          -destination 'generic/platform=tvOS Simulator' CODE_SIGNING_ALLOWED=NO -quiet build
      # The remote tests drive the Apple TV app in a simulator against the server's installed distribution serving
      # fixture channels, which FFmpeg makes.
      - name: Install FFmpeg
        run: brew install ffmpeg
      - name: Build the server distribution
        working-directory: backend
        run: ./gradlew --console=plain :server:installDist
      - name: Test the Apple TV app with the remote
        run: |
          out=build/tvos-ui
          mkdir -p "$out"
          python3 scripts/fixture_server.py --out "$out" > "$out/fixture.log" 2>&1 &
          fixture=$!
          trap 'kill "$fixture"' EXIT
          until [ -f "$out/server.env" ]; do
            kill -0 "$fixture" 2>/dev/null || { cat "$out/fixture.log"; exit 1; }
            sleep 1
          done
          set -a; . "$out/server.env"; set +a
          export TEST_RUNNER_SOFAKING_SERVER="$SOFAKING_SERVER" TEST_RUNNER_SOFAKING_TOKEN="$SOFAKING_TOKEN"
          # The newest tvOS runtime's first device.
          device=$(xcrun simctl list devices available --json | python3 -c 'import json, sys
          devices = json.load(sys.stdin)["devices"]
          print(next(d["udid"] for runtime in sorted(devices, reverse=True) if ".tvOS-" in runtime for d in devices[runtime]))')
          cd tvosApp
          xcodebuild -project SofaKingTV.xcodeproj -scheme SofaKingTV -configuration Debug -destination "id=$device" \
            CODE_SIGNING_ALLOWED=NO -resultBundlePath "../build/tvos-ui/RemoteTests.xcresult" test
      # A failure's screenshots, as PNG files beside the result bundle in the artifact.
      - name: Export the remote tests' screenshots
        if: failure()
        run: >-
          [ ! -d build/tvos-ui/RemoteTests.xcresult ] ||
          xcrun xcresulttool export attachments --path build/tvos-ui/RemoteTests.xcresult --output-path build/tvos-ui/attachments
      # A restored older distribution would otherwise be saved again under the new key, and the entry would grow.
      - name: Keep only the current Kotlin/Native distribution
        if: github.ref == 'refs/heads/main'
        env:
          VERSION: ${{ steps.kotlin.outputs.version }}
        run: find ~/.konan -maxdepth 1 -name 'kotlin-native-prebuilt-*' -not -name "*-$VERSION" -exec rm -rf {} +
      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports-apple
          path: |
            app/*/build/reports/
            app/*/build/test-results/
            app/build/tvos-ui/

  # The packages build while the checks run, so a main push is done when its slowest job is; nothing publishes
  # until every check and every package is green.
  snapshot:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    uses: ./.github/workflows/snapshot.yml
    with:
      publish: false
    secrets:
      ANDROID_DEBUG_KEYSTORE: ${{ secrets.ANDROID_DEBUG_KEYSTORE }}
      SOFAKING_CACHE_USERNAME: ${{ secrets.SOFAKING_CACHE_USERNAME }}
      SOFAKING_CACHE_PASSWORD: ${{ secrets.SOFAKING_CACHE_PASSWORD }}
      GRADLE_ENCRYPTION_KEY: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [check, apple, snapshot]
    permissions:
      contents: write
    uses: ./.github/workflows/publish-snapshot.yml
    with:
      version: ${{ needs.snapshot.outputs.version }}
    secrets:
      APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
