name: CI

# The app's code and build, and the contract it shares with the server; Markdown alone does not run it.
on:
  pull_request:
    paths:
      - "app/**"
      - "!app/docs/**"
      - "!app/**/*.md"
      - "contract/**"
      - "!contract/**/*.md"
      - "gradle/**"
      - "build-logic/**"
      - "!build-logic/**/*.md"
      - ".github/workflows/ci.yml"
      - ".github/workflows/snapshot.yml"
  push:
    branches: [main]
    paths:
      - "app/**"
      - "!app/docs/**"
      - "!app/**/*.md"
      - "contract/**"
      - "!contract/**/*.md"
      - "gradle/**"
      - "build-logic/**"
      - "!build-logic/**/*.md"
      - ".github/workflows/ci.yml"
      - ".github/workflows/snapshot.yml"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  SOFAKING_CACHE_USERNAME: ${{ secrets.SOFAKING_CACHE_USERNAME }}
  SOFAKING_CACHE_PASSWORD: ${{ secrets.SOFAKING_CACHE_PASSWORD }}
  SOFAKING_CACHE_PUSH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

defaults:
  run:
    working-directory: app

jobs:
  check:
    name: Test and build (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
      - name: Test, lint and build
        run: >-
          ./gradlew --continue
          :core:allTests :ui:jvmTest :ui:testAndroidHostTest :ui:jsNodeTest
          :core:compileTestKotlinLinuxX64 :ui:compileTestKotlinIosSimulatorArm64
          :androidApp:lintDebug :androidApp:assembleRelease
          :ui:wasmJsBrowserDistribution
      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports-linux
          path: |
            app/*/build/reports/
            app/*/build/test-results/
      - name: Upload render screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screenshots
          path: app/ui/build/screenshots/
          if-no-files-found: ignore

  # macOS minutes bill at 10x on a private repo, so Apple tests run on main and on demand; PRs compile the
  # iOS test klib on Linux above.
  apple:
    name: Test (Apple)
    if: github.event_name != 'pull_request'
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
      - name: Test Apple targets and link the iOS framework
        run: >-
          ./gradlew --continue
          :core:iosSimulatorArm64Test :core:macosArm64Test :core:tvosSimulatorArm64Test
          :core:watchosSimulatorArm64Test :ui:iosSimulatorArm64Test
          :ui:linkDebugFrameworkIosSimulatorArm64
      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports-apple
          path: |
            app/*/build/reports/
            app/*/build/test-results/

  snapshot:
    needs: [check, apple]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    uses: ./.github/workflows/snapshot.yml
    secrets:
      ANDROID_DEBUG_KEYSTORE: ${{ secrets.ANDROID_DEBUG_KEYSTORE }}
      SOFAKING_CACHE_USERNAME: ${{ secrets.SOFAKING_CACHE_USERNAME }}
      SOFAKING_CACHE_PASSWORD: ${{ secrets.SOFAKING_CACHE_PASSWORD }}
