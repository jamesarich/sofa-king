name: CodeQL

# Scans the server's Kotlin, with the contract it includes, and the workflows with GitHub's CodeQL every week and on a
# manual run, so its long Kotlin build never gates a pull request. Findings appear under the repository's Security tab.
# A pull request runs it only when it changes this file.
on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/codeql.yml"

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: java-kotlin
            build-mode: manual
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        if: matrix.language == 'java-kotlin'
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        if: matrix.language == 'java-kotlin'
        with:
          cache-read-only: true

      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      # CodeQL reads the Kotlin compiler's input as it runs, so the build skips the build cache, the configuration
      # cache and the daemon, and compiles every source itself.
      - name: Build the server
        if: matrix.language == 'java-kotlin'
        working-directory: backend
        run: ./gradlew --no-daemon --no-build-cache --no-configuration-cache :server:compileKotlin

      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:${{ matrix.language }}
