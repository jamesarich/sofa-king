name: Dependency graph

# Sends each build's resolved dependencies to GitHub so Dependabot alerts cover the Gradle dependencies too; Renovate
# updates them, GitHub warns about the vulnerable ones. Runs on main only, as the graph needs write access.
on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "backend/**"
      - "contract/**"
      - "gradle/**"
      - "build-logic/**"
      - ".github/workflows/dependency-submission.yml"
  workflow_dispatch:

concurrency:
  group: dependency-graph
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  submit:
    name: Submit (${{ matrix.build }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        build: [app, backend, contract]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/dependency-submission@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          build-root-directory: ${{ matrix.build }}
          cache-read-only: true
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
