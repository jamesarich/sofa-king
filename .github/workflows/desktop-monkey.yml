name: Desktop monkey

# The desktop app's distribution in a virtual X display, with libVLC playing, against the server's installed
# distribution serving fixture channels (app/scripts/desktop-monkey.py). It first checks the break screen on a marked
# channel, then presses random keys. Fails when the break screen misses a break, the app exits, logs an
# uncaught exception or an unhandled failure, draws a blank screen, or does not quit and release its session when its
# window closes. Nightly, by hand, and on changes to itself.
on:
  schedule:
    - cron: "41 6 * * *"
  workflow_dispatch:
    inputs:
      keys:
        description: Keys to press
        default: "1000"
      seed:
        description: Random seed (empty for a new one)
        default: ""
  pull_request:
    paths:
      - "app/scripts/desktop-monkey.py"
      - "app/scripts/fixture_server.py"
      - ".github/workflows/desktop-monkey.yml"

concurrency:
  group: desktop-monkey-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  SOFAKING_CACHE_USERNAME: ${{ secrets.SOFAKING_CACHE_USERNAME }}
  SOFAKING_CACHE_PASSWORD: ${{ secrets.SOFAKING_CACHE_PASSWORD }}

jobs:
  monkey:
    name: Monkey (Linux desktop)
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: true
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
      # FFmpeg makes the fixture channels; the app plays them through libVLC, in Xvfb, driven by xdotool, and the
      # script closes the window through python-xlib. A session bus from dbus-run-session lets the app register its
      # MPRIS media session, as it does on a desktop.
      - name: Install FFmpeg, libVLC, D-Bus and the X tools
        uses: ./.github/actions/apt-install
        with:
          packages: ffmpeg vlc-plugin-base xvfb xdotool imagemagick python3-xlib dbus
      - name: Build the server distribution
        working-directory: backend
        run: ./gradlew --console=plain :server:installDist
      - name: Build the desktop app
        working-directory: app
        run: ./gradlew --console=plain :ui:createDistributable
      - name: Check the break screen and press random keys on the desktop app
        working-directory: app
        env:
          SOFAKING_DESKTOP_MONKEY_KEYS: ${{ inputs.keys || '1000' }}
          SOFAKING_DESKTOP_MONKEY_SEED: ${{ inputs.seed }}
        run: dbus-run-session -- python3 scripts/desktop-monkey.py --break-check --out build/desktop-monkey
      - name: Upload the logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-monkey
          path: app/build/desktop-monkey/
          if-no-files-found: ignore

  # A scheduled night that failed opens an issue, or comments on the open one; nothing closes it but a person.
  report:
    name: Report a failed night
    needs: monkey
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TITLE: Nightly desktop monkey failed
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Open or update the issue
        run: |
          number=$(gh issue list --state open --search "$TITLE in:title" --json number,title --jq 'map(select(.title == env.TITLE))[0].number // empty')
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "Failed again: $RUN_URL"
          else
            gh issue create --title "$TITLE" --body "The scheduled run failed: $RUN_URL"
          fi
