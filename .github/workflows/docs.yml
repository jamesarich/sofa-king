name: Docs

# Builds the documentation site with MkDocs (mkdocs.yml) for every pull request and push that changes a Markdown page,
# the site's files or the server's OpenAPI document. The build is strict, so a link to a missing page or anchor fails
# it, and so does an image a page draws that is not a tracked file (docs/site/check_images.py). A push to main, or a manual run on main, then publishes the site to GitHub Pages.
on:
  push:
    branches: [main]
    paths:
      - "**/*.md"
      - "docs/**"
      - "mkdocs.yml"
      - "backend/server/src/main/resources/api/openapi.json"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "**/*.md"
      - "docs/**"
      - "mkdocs.yml"
      - "backend/server/src/main/resources/api/openapi.json"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"
          cache: pip
          cache-dependency-path: docs/site/requirements.txt
      - name: Check the images
        run: python3 docs/site/check_images.py
      - name: Install MkDocs
        run: pip install -r docs/site/requirements.txt
      - name: Build
        env:
          NO_MKDOCS_2_WARNING: "1"
        run: |
          python3 docs/site/stage.py
          mkdocs build --strict
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: build/site

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
