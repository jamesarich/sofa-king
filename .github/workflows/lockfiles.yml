name: Lockfiles

# Rewrites the lockfiles and verification metadata on a Renovate branch that changes the catalog, a wrapper, a settings
# plugin or a lockfile, and on any branch on demand. The locks and verification jobs run the new versions' Gradle code with
# a read-only token and hand their changes over as a patch. The push job commits them to the branch and starts CI and
# Backend on that commit, since a push made with the workflow token starts no workflows of its own. renovate.json lists
# that commit's author in gitIgnoredAuthors, so Renovate keeps rebasing the branch and this workflow runs again.
on:
  pull_request:
    paths:
      - "gradle/libs.versions.toml"
      - "**/gradle-wrapper.properties"
      - "**/settings.gradle.kts"
      # Renovate's weekly lock file maintenance, which resolves on Linux only.
      - "**/*.lockfile"
  workflow_dispatch:

concurrency:
  group: lockfiles-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The lockfiles name the Apple configurations, which keep their old lock state on Linux.
  locks:
    # Never on main: the push job would commit there.
    if: (github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main') || (github.actor == 'renovate[bot]' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: true
      - name: Rewrite the lockfiles
        run: gradle/update-locks.sh
      - name: Collect the changes
        run: |
          git add -A
          git diff --cached --binary > "$RUNNER_TEMP/locks.patch"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: locks-patch
          path: ${{ runner.temp }}/locks.patch
          retention-days: 1

  # The server's tests, which the verification metadata script runs, generate HLS fixtures with FFmpeg; CI runs them on Linux.
  verification:
    needs: locks
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: locks-patch
          path: ${{ runner.temp }}
      - name: Apply the new lockfiles
        run: if [ -s "$RUNNER_TEMP/locks.patch" ]; then git apply --index "$RUNNER_TEMP/locks.patch"; fi
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: true
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Rewrite the verification metadata
        run: backend/scripts/update-verification-metadata.sh
      - id: diff
        name: Collect the changes
        run: |
          git add -A
          git diff --cached --binary > "$RUNNER_TEMP/lockfiles.patch"
          if [ -s "$RUNNER_TEMP/lockfiles.patch" ]; then
            git diff --cached --stat
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.diff.outputs.changed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lockfiles-patch
          path: ${{ runner.temp }}/lockfiles.patch
          retention-days: 1

  push:
    needs: verification
    if: needs.verification.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: write
    env:
      BRANCH: ${{ github.head_ref || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: lockfiles-patch
          path: ${{ runner.temp }}
      # Pushing to the commit the refresh started from fails if the branch has moved on; its new run takes over.
      - name: Commit and push
        run: |
          git apply --index "$RUNNER_TEMP/lockfiles.patch"
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "build(deps): refresh the lockfiles and verification metadata"
          git push origin "HEAD:refs/heads/$BRANCH"
      - name: Run CI and Backend on the new commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$BRANCH"
          gh workflow run backend.yml --repo "$GITHUB_REPOSITORY" --ref "$BRANCH"
