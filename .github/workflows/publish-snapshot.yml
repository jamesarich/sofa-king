name: Publish snapshot

# Replaces the `snapshot` prerelease with the packages the calling run uploaded as `dist-*` artifacts. `snapshot.yml`
# calls it from a manual run; `ci.yml` calls it once the checks and the packages are all green.
on:
  workflow_call:
    inputs:
      suffix:
        description: The version suffix the packages were built with, for the release title.
        required: true
        type: string
    secrets:
      APT_SIGNING_KEY:
        description: The armored private key, without a passphrase, that signs the apt repository.
        required: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: Replace the snapshot release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION_SUFFIX: ${{ inputs.suffix }}
        run: |
          gh release delete snapshot --cleanup-tag --yes || true
          gh release create snapshot dist/* \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Snapshot${VERSION_SUFFIX}" \
            --notes "Built from ${GITHUB_SHA} by ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}. Unsigned desktop packages; the APK uses a debug key."

  # The apt repository on GitHub Pages: the snapshot .deb, signed with APT_SIGNING_KEY, so apt and Software Updater
  # offer each snapshot once the source is added. Pages keeps only the latest one.
  apt:
    needs: publish
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist-linux
          path: dist
      - name: Build the repository
        env:
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
        run: |
          command -v apt-ftparchive || { sudo apt-get update && sudo apt-get install -y --no-install-recommends apt-utils; }
          gpg --batch --import <<< "$APT_SIGNING_KEY"
          key=$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr:/ { print $10; exit }')
          version=$(dpkg-deb -f dist/sofa-king-snapshot-linux-amd64.deb Version)
          mkdir -p site/pool/main site/dists/stable/main/binary-amd64
          cp dist/sofa-king-snapshot-linux-amd64.deb "site/pool/main/sofa-king_${version}_amd64.deb"
          cd site
          gpg --export "$key" > sofa-king.gpg
          apt-ftparchive packages pool > dists/stable/main/binary-amd64/Packages
          gzip -9kn dists/stable/main/binary-amd64/Packages
          apt-ftparchive \
            -o APT::FTPArchive::Release::Origin="Sofa King" \
            -o APT::FTPArchive::Release::Label="Sofa King" \
            -o APT::FTPArchive::Release::Suite=stable \
            -o APT::FTPArchive::Release::Codename=stable \
            -o APT::FTPArchive::Release::Architectures=amd64 \
            -o APT::FTPArchive::Release::Components=main \
            release dists/stable > Release
          mv Release dists/stable/Release
          gpg --batch --yes --local-user "$key" --clearsign -o dists/stable/InRelease dists/stable/Release
          gpg --batch --yes --local-user "$key" --armor --detach-sign -o dists/stable/Release.gpg dists/stable/Release
          printf 'deb [signed-by=/usr/share/keyrings/sofa-king.gpg] %s stable main\n' \
            "https://${GITHUB_REPOSITORY_OWNER,,}.github.io/${GITHUB_REPOSITORY#*/}" > sofa-king.list
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
