name: Publish snapshot

# Replaces the `snapshot` prerelease with the packages the calling run uploaded as `dist-*` artifacts. `snapshot.yml`
# calls it from a manual run; `ci.yml` calls it once the checks and the packages are all green.
on:
  workflow_call:
    inputs:
      version:
        description: The version the packages were built with, such as 0.1.0-dev.42+abc1234, for the release title.
        required: true
        type: string
    secrets:
      APT_SIGNING_KEY:
        description: The armored secret key that signs the apt repository; without it the release carries none.
        required: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      # The packages' build attestations take the run's OpenID Connect identity.
      id-token: write
      attestations: write
    env:
      # A step's condition cannot read a secret, only whether the job has one.
      SIGN_APT: ${{ secrets.APT_SIGNING_KEY != '' }}
    steps:
      # The whole history, for the notes' range.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      # A build attestation for every package, which `gh attestation verify` checks, as app/docs/security.md shows.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/sofa-king-*
      # The release doubles as a flat apt repository, so `apt upgrade` installs each snapshot's .deb: the index, the
      # signed Release and the public key that checks it sit beside the package.
      - name: Sign the apt repository
        env:
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
        if: env.SIGN_APT == 'true'
        working-directory: dist
        run: |
          export GNUPGHOME="$(mktemp -d)"
          printf '%s\n' "$APT_SIGNING_KEY" | gpg --batch --import
          command -v apt-ftparchive >/dev/null || sudo apt-get install -y --no-install-recommends apt-utils
          apt-ftparchive packages . > Packages
          gzip -9kn Packages
          apt-ftparchive \
            -o APT::FTPArchive::Release::Origin="Sofa King" \
            -o APT::FTPArchive::Release::Label="Sofa King" \
            -o APT::FTPArchive::Release::Suite=snapshot \
            -o APT::FTPArchive::Release::Codename=snapshot \
            -o APT::FTPArchive::Release::Architectures=amd64 \
            release . > "$RUNNER_TEMP/Release"
          mv "$RUNNER_TEMP/Release" Release
          gpg --batch --yes --clearsign -o InRelease Release
          gpg --batch --yes --armor --detach-sign -o Release.gpg Release
          gpg --export > sofa-king-archive-keyring.gpg
      # The notes add a section for the commits since the release being replaced, which was created at its commit, above
      # that release's own sections. Without that release, or when its commit is not behind this one, the new section
      # covers the last 20 commits.
      - name: Find the notes' range
        id: range
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          previous=$(gh release view snapshot --json targetCommitish --jq .targetCommitish 2>/dev/null || true)
          gh release view snapshot --json body --jq .body 2>/dev/null | tr -d '\r' > "$RUNNER_TEMP/previous.md" || true
          if [ "$previous" = "$GITHUB_SHA" ]; then
            cp "$RUNNER_TEMP/previous.md" "$RUNNER_TEMP/notes.md"
            echo "reuse=true" >> "$GITHUB_OUTPUT"
          elif [ -n "$previous" ] && git merge-base --is-ancestor "$previous" HEAD 2>/dev/null; then
            echo "range=$previous..HEAD" >> "$GITHUB_OUTPUT"
          else
            echo "range=HEAD~20..HEAD" >> "$GITHUB_OUTPUT"
          fi
      # A rerun of a published commit keeps that release's notes.
      - name: Write the changes
        if: steps.range.outputs.reuse != 'true'
        uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff # v4
        with:
          config: .github/cliff.toml
          args: --strip all ${{ steps.range.outputs.range }}
        env:
          OUTPUT: ${{ runner.temp }}/changes.md
      # The build line, this snapshot's section when it has changes, then the previous release's sections up to 20 in
      # all, so the app's update check can list every change since the build a device runs.
      - name: Write the notes
        if: steps.range.outputs.reuse != 'true'
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          VERSION: ${{ inputs.version }}
        run: |
          {
            echo "Built from ${GITHUB_SHA} by ${RUN_URL}. The desktop packages are unsigned."
            if [ -s "$RUNNER_TEMP/changes.md" ]; then
              printf '\n## %s\n' "$VERSION"
              cat "$RUNNER_TEMP/changes.md"
              echo
            fi
            awk '/^## /{n++} n>=1 && n<=19' "$RUNNER_TEMP/previous.md"
          } > "$RUNNER_TEMP/notes.md"
      - name: Replace the snapshot release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ inputs.version }}
        run: |
          gh release delete snapshot --cleanup-tag --yes || true
          gh release create snapshot dist/* \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Snapshot $VERSION" \
            --notes-file "$RUNNER_TEMP/notes.md"
