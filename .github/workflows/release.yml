name: Release

# Publishes a stable release for a `v*` tag, such as v0.1.0, whose version must match the catalog's `sofaking`
# (.github/version.sh refuses any other). It builds the same packages as a snapshot through snapshot.yml, then
# publish-release.yml makes them the `vX.Y.Z` release, which GitHub marks the latest. The server image for the same tag
# comes from backend.yml as :X.Y.Z, :X.Y and :latest.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # A tag on a side branch would publish :latest and a release for unreviewed code.
  on-main:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check the tagged commit is on main
        run: |
          git fetch --quiet origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "::error::$GITHUB_REF_NAME is not on main; tag a commit that main contains."
            exit 1
          }

  packages:
    needs: on-main
    # snapshot.yml's publish job, skipped here, still needs every permission it asks for granted.
    permissions:
      contents: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/snapshot.yml
    with:
      publish: false
    secrets:
      ANDROID_DEBUG_KEYSTORE: ${{ secrets.ANDROID_DEBUG_KEYSTORE }}
      ANDROID_RELEASE_KEYSTORE: ${{ secrets.ANDROID_RELEASE_KEYSTORE }}
      ANDROID_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
      ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
      SOFAKING_CACHE_USERNAME: ${{ secrets.SOFAKING_CACHE_USERNAME }}
      SOFAKING_CACHE_PASSWORD: ${{ secrets.SOFAKING_CACHE_PASSWORD }}
      GRADLE_ENCRYPTION_KEY: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

  publish:
    needs: packages
    permissions:
      contents: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/publish-release.yml
    with:
      version: ${{ needs.packages.outputs.version }}
