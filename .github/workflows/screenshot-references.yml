name: Screenshot references

# Labeling a pull request `screenshots` renders the app's screenshot test references on the Linux runner, the render CI
# compares against, and pushes the changed images to the pull request's branch. A reference taken on another machine
# differs by anti-aliasing and fails there. app/docs/development.md has the steps.
on:
  pull_request:
    types: [labeled]

concurrency:
  group: screenshot-references-${{ github.event.pull_request.number }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  SOFAKING_CACHE_USERNAME: ${{ secrets.SOFAKING_CACHE_USERNAME }}
  SOFAKING_CACHE_PASSWORD: ${{ secrets.SOFAKING_CACHE_PASSWORD }}

jobs:
  update:
    name: Update the references
    # A fork's pull request gets a read-only token and no secrets, and its branch is not ours to push to.
    if: >-
      github.event.label.name == 'screenshots'
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    # Dispatching ci.yml needs actions: write.
    permissions:
      contents: write
      pull-requests: write
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PR: ${{ github.event.pull_request.number }}
      BRANCH: ${{ github.event.pull_request.head.ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: true
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
      - name: Render the references
        working-directory: app
        run: ./gradlew :androidApp:updateDebugScreenshotTestDefaultTestSuite
      - name: Commit the changed references
        id: commit
        run: |
          git add app/androidApp/src/screenshotTestDefaultDebug/reference
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --cached --name-status | sed 's#\tapp/androidApp/src/screenshotTestDefaultDebug/reference/# #' > "$RUNNER_TEMP/changed.txt"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test(app): update screenshot references from the Linux render'
          # Not forced: a push to the branch since the label was added makes this one fail rather than overwrite it.
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GH_REPO}.git" "HEAD:refs/heads/${BRANCH}"
          echo "changed=true" >> "$GITHUB_OUTPUT"
      # Pushes made with the workflow token start no checks, so CI is dispatched on the branch. A dispatched run may not
      # appear among the pull request's checks.
      - name: Run CI on the branch
        if: steps.commit.outputs.changed == 'true'
        run: gh workflow run ci.yml --ref "$BRANCH"
      - name: Comment on the pull request
        if: steps.commit.outputs.changed == 'true'
        run: |
          {
            echo 'Updated these references from the Linux render and pushed them to this branch:'
            echo
            echo '```'
            cat "$RUNNER_TEMP/changed.txt"
            echo '```'
            echo
            echo 'Look at each image before you merge. The comparison re-runs under Actions through a dispatched CI run on the branch, which may not attach to this pull request'"'"'s checks; find it under Actions, CI, branch `'"$BRANCH"'`.'
          } > "$RUNNER_TEMP/comment.md"
          gh pr comment "$PR" --body-file "$RUNNER_TEMP/comment.md"
      - name: Comment that nothing changed
        if: steps.commit.outputs.changed == 'false'
        run: gh pr comment "$PR" --body 'The Linux render matches the references on this branch; nothing to update.'
      # The label comes off whatever happened, so applying it again retries.
      - name: Remove the label
        if: always()
        run: gh pr edit "$PR" --remove-label screenshots
