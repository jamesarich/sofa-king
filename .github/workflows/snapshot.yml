name: Snapshot

# Builds the packages of the rolling `snapshot` prerelease. CI calls it for a main push, alongside the checks, and
# publishes once everything is green; a manual run builds and publishes by itself.
on:
  workflow_call:
    inputs:
      publish:
        description: Replace the release here; CI passes false and publishes once its checks pass too.
        required: false
        default: true
        type: boolean
    outputs:
      suffix:
        description: The version suffix every package was built with.
        value: ${{ jobs.version.outputs.suffix }}
    secrets:
      ANDROID_DEBUG_KEYSTORE:
        required: false
      SOFAKING_CACHE_USERNAME:
        required: false
      SOFAKING_CACHE_PASSWORD:
        required: false
  workflow_dispatch:

concurrency:
  group: snapshot
  cancel-in-progress: false

permissions:
  contents: read

# Reads the remote build cache; a main push's checks run at the same time, so a package compiles what it needs itself.
env:
  SOFAKING_CACHE_USERNAME: ${{ secrets.SOFAKING_CACHE_USERNAME }}
  SOFAKING_CACHE_PASSWORD: ${{ secrets.SOFAKING_CACHE_PASSWORD }}

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      code: ${{ steps.v.outputs.code }}
      suffix: ${{ steps.v.outputs.suffix }}
    steps:
      - id: v
        run: |
          echo "code=${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "suffix=-dev.${{ github.run_number }}+${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

  linux:
    name: Android and Linux desktop
    needs: version
    runs-on: ubuntu-24.04
    # The build takes a few minutes; the limit bounds a hang.
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: true
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
      # A fixed key lets each snapshot install over the last; without the secret every run signs with a new debug key.
      - name: Restore the signing key
        env:
          KEYSTORE: ${{ secrets.ANDROID_DEBUG_KEYSTORE }}
        run: |
          if [ -n "$KEYSTORE" ]; then mkdir -p ~/.android && echo "$KEYSTORE" | base64 -d > ~/.android/debug.keystore; fi
      - name: Build
        env:
          VERSION_CODE: ${{ needs.version.outputs.code }}
          VERSION_SUFFIX: ${{ needs.version.outputs.suffix }}
        run: >-
          ./gradlew
          "-Psofaking.versionCode=$VERSION_CODE"
          "-Psofaking.versionSuffix=$VERSION_SUFFIX"
          :androidApp:assembleRelease
          :ui:packageDistributionForCurrentOS
      - name: Collect
        run: |
          mkdir "$GITHUB_WORKSPACE/dist"
          cp androidApp/build/outputs/apk/release/androidApp-release.apk "$GITHUB_WORKSPACE/dist/sofa-king-snapshot.apk"
          cp ui/build/compose/binaries/main/deb/*.deb "$GITHUB_WORKSPACE/dist/sofa-king-snapshot-linux-amd64.deb"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-linux
          path: dist/
          if-no-files-found: error

  # The two web bundles, one job each: the production webpack of either is the longest single task in the snapshot,
  # so they run beside the packages instead of after them, and each npm install has the yarn.lock to itself.
  web:
    name: Web (${{ matrix.target }})
    needs: version
    strategy:
      matrix:
        include:
          - target: wasmJs
            asset: sofa-king-snapshot-web-wasm.zip
          - target: js
            asset: sofa-king-snapshot-web-js.zip
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: true
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
      - name: Build
        env:
          VERSION_CODE: ${{ needs.version.outputs.code }}
          VERSION_SUFFIX: ${{ needs.version.outputs.suffix }}
        run: ./gradlew "-Psofaking.versionCode=$VERSION_CODE" "-Psofaking.versionSuffix=$VERSION_SUFFIX" :ui:${{ matrix.target }}BrowserDistribution
      - name: Collect
        run: |
          mkdir "$GITHUB_WORKSPACE/dist"
          (cd ui/build/dist/${{ matrix.target }}/productionExecutable && zip -qr "$GITHUB_WORKSPACE/dist/${{ matrix.asset }}" .)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-web-${{ matrix.target }}
          path: dist/
          if-no-files-found: error

  desktop:
    name: Desktop (${{ matrix.os }})
    needs: version
    strategy:
      matrix:
        include:
          - os: macos-latest
            format: dmg
            asset: sofa-king-snapshot-macos-arm64.dmg
          - os: windows-latest
            format: msi
            asset: sofa-king-snapshot-windows-x64.msi
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          # Only this job runs on Windows, so it keeps its own Gradle home; read-only, it started cold every time
          # and spent most of its run downloading. macOS reads the Apple job's.
          cache-read-only: ${{ matrix.os != 'windows-latest' }}
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
      # The same version as the Linux job, so every package in one snapshot shows one About row.
      - name: Package
        env:
          VERSION_CODE: ${{ needs.version.outputs.code }}
          VERSION_SUFFIX: ${{ needs.version.outputs.suffix }}
        run: ./gradlew "-Psofaking.versionCode=$VERSION_CODE" "-Psofaking.versionSuffix=$VERSION_SUFFIX" :ui:packageDistributionForCurrentOS
      - name: Collect
        run: |
          mkdir ../dist
          cp ui/build/compose/binaries/main/${{ matrix.format }}/*.${{ matrix.format }} "../dist/${{ matrix.asset }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ matrix.format }}
          path: dist/
          if-no-files-found: error

  publish:
    if: ${{ inputs.publish != false }}
    needs: [version, linux, web, desktop]
    permissions:
      contents: write
    uses: ./.github/workflows/publish-snapshot.yml
    with:
      suffix: ${{ needs.version.outputs.suffix }}
