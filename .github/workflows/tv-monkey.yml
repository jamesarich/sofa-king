name: TV monkey

# Random remote keys on the debug app in a headless Android TV emulator, against the server's installed distribution
# serving fixture channels and a short fixture show (app/scripts/tv-monkey.py), after the Maestro flows in app/maestro.
# Fails on a failed flow, a crash, an ANR or a playback session the app left open in the background; StrictMode's findings
# are counted in the summary and kept in the artifact. Nightly, by hand, and on changes to itself or the flows.
on:
  schedule:
    - cron: "23 6 * * *"
  workflow_dispatch:
    inputs:
      keys:
        description: Remote keys to press
        default: "1500"
      seed:
        description: Random seed (empty for a new one)
        default: ""
  pull_request:
    paths:
      - "app/scripts/tv-monkey.py"
      - "app/scripts/fixture_server.py"
      - "app/maestro/**"
      - ".github/workflows/tv-monkey.yml"

concurrency:
  group: tv-monkey-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  SOFAKING_CACHE_USERNAME: ${{ secrets.SOFAKING_CACHE_USERNAME }}
  SOFAKING_CACHE_PASSWORD: ${{ secrets.SOFAKING_CACHE_PASSWORD }}

jobs:
  monkey:
    name: Monkey (Android TV 36)
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: true
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
      # The fixture channels are a clip FFmpeg generates; the server relays HLS through FFmpeg too.
      - name: Install FFmpeg
        uses: ./.github/actions/apt-install
        with:
          packages: ffmpeg
      - name: Build the server distribution
        working-directory: backend
        run: ./gradlew --console=plain :server:installDist
      - name: Build the debug app
        working-directory: app
        run: ./gradlew --console=plain :androidApp:assembleDebug
      # Maestro drives the scripted flows through the emulator's accessibility tree; pinned to one release.
      - name: Install Maestro
        env:
          MAESTRO_VERSION: "2.11.0"
        run: |
          curl -fsSL "https://github.com/mobile-dev-inc/maestro/releases/download/cli-$MAESTRO_VERSION/maestro.zip" -o "$RUNNER_TEMP/maestro.zip"
          unzip -q "$RUNNER_TEMP/maestro.zip" -d "$HOME"
          echo "$HOME/maestro/bin" >> "$GITHUB_PATH"
      # The emulator needs hardware acceleration, which the runner gives only to the kvm group.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run the flows and press random remote keys in the emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        env:
          SOFAKING_MONKEY_KEYS: ${{ inputs.keys || '1500' }}
          SOFAKING_MONKEY_SEED: ${{ inputs.seed }}
        with:
          api-level: 36
          target: android-tv
          arch: x86_64
          profile: tv_1080p
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: python3 app/scripts/tv-monkey.py --apk app/androidApp/build/outputs/apk/debug/androidApp-debug.apk --flows app/maestro --out app/build/tv-monkey
      - name: Upload the logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tv-monkey
          path: app/build/tv-monkey/
          if-no-files-found: ignore
