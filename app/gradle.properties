org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.caching=true
# The remote build cache in ../gradle/build-cache.settings.gradle.kts sits behind a home connection; a store of a large
# entry (a klib or a jar of tens of MB) ran past Gradle's 30 s default, and one such failure switches the remote cache
# off for the rest of that build. Two minutes covers the uploads.
systemProp.org.gradle.internal.http.socketTimeout=120000
org.gradle.parallel=true
org.gradle.configuration-cache=true
org.gradle.configuration-cache.parallel=true
# Gradle 10 stops inferring this from org.gradle.parallel.
org.gradle.tooling.parallel=true
# Apple targets build only on macOS; skip them quietly elsewhere.
kotlin.native.ignoreDisabledTargets=true
# Recompile only the changed Kotlin/Native sources (Beta; JetBrains plans to make it the default).
kotlin.incremental.native=true
kotlin.code.style=official
# Fail the compile on any Kotlin warning (the sofaking.kotlin convention in build-logic reads this).
sofaking.warningsAsErrors=true
# The app version is `sofaking` in gradle/libs.versions.toml. Snapshot builds set these with -P: the run number, and
# a suffix such as -dev.42+abc1234 that Android's versionName and the About row append. The desktop package keeps the
# numeric version jpackage requires.
sofaking.versionCode=1
sofaking.versionSuffix=
# Baseline Profile generation runs instrumented tests against the installed app; keep it, and its server setup,
# installed afterwards instead of uninstalling it.
android.injected.androidTest.leaveApksInstalledAfterRun=true
