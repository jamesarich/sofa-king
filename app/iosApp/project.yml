# XcodeGen spec for the iOS host; `xcodegen` in this directory writes SofaKing.xcodeproj.
name: SofaKing
options:
  # Writes ../build/Version.xcconfig (MARKETING_VERSION from the catalog's `sofaking` version) before generating.
  preGenCommand: ../tools/version-xcconfig.sh
  bundleIdPrefix: dev.jamesrich
  deploymentTarget:
    iOS: "16.0"
targets:
  SofaKing:
    type: application
    platform: iOS
    sources: [SofaKing]
    configFiles:
      Debug: ../build/Version.xcconfig
      Release: ../build/Version.xcconfig
    info:
      path: SofaKing/Info.plist
      properties:
        CFBundleDisplayName: Sofa King
        # XcodeGen fills in the bundle name, identifier, version (from Version.xcconfig), executable and package type.
        LSApplicationCategoryType: public.app-category.entertainment
        NSHumanReadableCopyright: "© 2026 James Rich. GPL-3.0-only; source at https://github.com/jamesarich/sofa-king."
        # Only HTTPS and the system's TLS, so export compliance needs no declaration on each upload.
        ITSAppUsesNonExemptEncryption: false
        CADisableMinimumFrameDurationOnPhone: true
        UILaunchScreen: {}
        # The Compose theme is dark only, so the system's keyboard, alerts and sheets match it.
        UIUserInterfaceStyle: Dark
        # Landscape only, which on iPad requires full screen (no Split View or Slide Over).
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        # The Sofa King server serves plain HTTP on the LAN, as Android's network_security_config allows.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSLocalNetworkUsageDescription: Sofa King connects to your Sofa King server on this network.
        # Settings lists the servers that advertise this type; iOS browses only for types listed here.
        NSBonjourServices: [_sofaking._tcp]
        # Music plays on behind the app and on the lock screen.
        UIBackgroundModes: [audio]
        # The admin portal's QR code pairs the app with `sofaking://pair?server=…&code=…`; `sofaking://live` and `sofaking://vod` links play.
        CFBundleURLTypes:
          - CFBundleURLName: dev.jamesrich.sofaking
            CFBundleURLSchemes: [sofaking]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.jamesrich.sofaking
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        # ui has no iosX64 target, so simulator builds are Apple silicon only.
        "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
        FRAMEWORK_SEARCH_PATHS: "$(SRCROOT)/../ui/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"
        OTHER_LDFLAGS: [-framework, SofaKingUi]
    preBuildScripts:
      - name: Build the Kotlin framework
        basedOnDependencyAnalysis: false
        script: |
          cd "$SRCROOT/.."
          ./gradlew :ui:embedAndSignAppleFrameworkForXcode
    # `xcodebuild test` runs the touch tests; they skip without the fixture server (docs/development.md).
    scheme:
      testTargets: [SofaKingUITests]
  # The app driven by touch against app/scripts/fixture_server.py, and against a real server for the break check.
  SofaKingUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [SofaKingUITests]
    dependencies:
      - target: SofaKing
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.jamesrich.sofaking.uitests
        GENERATE_INFOPLIST_FILE: YES
        "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
