# The stream card on a live channel (see usage.md, Live TV): Stream info on the bar opens it, and it shows how the
# audio leaves the device on Android (#417) and the stream's health as the server sees it (#414). Starts anywhere (a
# player left open is left first), opens channel 2, the HLS channel, by its link, and ends on the guide.
appId: dev.jamesrich.sofaking
name: Stream card on a live channel
---
- runFlow:
    when:
      visible:
        id: "player"
    commands:
      - pressKey: Back
- openLink: "sofaking://live/2"
- extendedWaitUntil:
    visible:
      id: "player"
    timeout: 30000
# Pausing holds the bar up and the picture still, since Maestro reads the screen slower than the bar's 5 seconds
# while video plays. Right then moves into the bar's buttons and walks along them to Stream info, wherever the Previous
# channel button puts it. The button names itself to the remote, and its name also shows under the row while it has
# focus, so a second "Stream info" on screen marks it focused.
- pressKey: Remote Media Play Pause
- extendedWaitUntil:
    visible: "Stream info"
    timeout: 5000
- pressKey: Remote Dpad Right
- repeat:
    times: 6
    while:
      notVisible:
        text: "Stream info"
        index: 1
    commands:
      - pressKey: Remote Dpad Right
- assertVisible:
    text: "Stream info"
    index: 1
- pressKey: Remote Dpad Center
- extendedWaitUntil:
    visible: "Audio out"
    timeout: 10000
- assertVisible: "Decoded to .*|Passed through.*"
# The card reads the session's health from the server while it is open.
- extendedWaitUntil:
    visible: ".*\\d+ stalls?.*"
    timeout: 10000
- assertVisible: "Health"
- assertVisible: ".*\\d+ source switch(es)?.*"
# Back closes the card and then leaves the player for the guide.
- pressKey: Back
- extendedWaitUntil:
    notVisible: "Audio out"
    timeout: 5000
- pressKey: Back
- extendedWaitUntil:
    visible:
      id: "guide"
    timeout: 15000
