# Search in the header finds a channel on now and its programs coming up, the first result's sheet watches it, and Back
# returns to the results and then to the tab it came from. Starts on any tab (a player left open is left first), since
# every tab's header has Search once the server has answered, and ends back on that tab.
appId: dev.jamesrich.sofaking
name: Header search
---
- runFlow:
    when:
      visible:
        id: "player"
    commands:
      - pressKey: Back
- extendedWaitUntil:
    visible: "Search"
    timeout: 15000
- tapOn: "Search"
- extendedWaitUntil:
    visible: "Channel, program, title or cast"
    timeout: 10000
- tapOn: "Channel, program, title or cast"
- inputText: "Sofa Sports"
- extendedWaitUntil:
    visible: "On now"
    timeout: 20000
# The keyboard covers the On later row; with it closed, Down from the field reaches the first result, the channel on
# now.
- hideKeyboard
- extendedWaitUntil:
    visible: "On later"
    timeout: 20000
- pressKey: Remote Dpad Down
# OK on a result opens its program's sheet with Watch focused, as in the guide.
- pressKey: Remote Dpad Center
- extendedWaitUntil:
    visible: "Watch"
    timeout: 10000
- pressKey: Remote Dpad Center
- extendedWaitUntil:
    visible:
      id: "player"
    timeout: 30000
- pressKey: Back
# Back from the player may land on the sheet again; Back once more closes it.
- runFlow:
    when:
      visible: "Watch"
    commands:
      - pressKey: Back
- extendedWaitUntil:
    visible: "On now"
    timeout: 15000
- assertNotVisible: "Watch"
- assertNotVisible:
    id: "player"
- pressKey: Back
- extendedWaitUntil:
    notVisible: "On now"
    timeout: 15000
