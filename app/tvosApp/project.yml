# XcodeGen spec for the Apple TV app; `xcodegen` in this directory writes SofaKingTV.xcodeproj.
# The app is SwiftUI on top of core's SofaKingCore framework: Compose Multiplatform does not render on tvOS.
name: SofaKingTV
options:
  # Writes ../build/Version.xcconfig (MARKETING_VERSION from the catalog's `sofaking` version) before generating.
  preGenCommand: ../tools/version-xcconfig.sh
  bundleIdPrefix: dev.jamesrich
  deploymentTarget:
    tvOS: "17.0"
targets:
  SofaKingTV:
    type: application
    platform: tvOS
    sources: [SofaKingTV]
    dependencies:
      - target: TopShelf
        embed: true
    configFiles:
      Debug: ../build/Version.xcconfig
      Release: ../build/Version.xcconfig
    info:
      path: SofaKingTV/Info.plist
      properties:
        CFBundleDisplayName: Sofa King
        UILaunchScreen: {}
        # The Sofa King server serves plain HTTP on the LAN, as Android's network_security_config allows.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSLocalNetworkUsageDescription: Sofa King connects to your Sofa King server on this network.
        # The Top Shelf opens a channel with `sofaking://channel/<guideId>`.
        CFBundleURLTypes:
          - CFBundleURLName: dev.jamesrich.sofaking.tv
            CFBundleURLSchemes: [sofaking]
    # The app group carries the recent channels to the Top Shelf extension; both targets must be signed for it.
    entitlements:
      path: SofaKingTV/SofaKingTV.entitlements
      properties:
        com.apple.security.application-groups: [group.dev.jamesrich.sofaking]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.jamesrich.sofaking.tv
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        # core has no tvosX64 target, so simulator builds are Apple silicon only.
        "EXCLUDED_ARCHS[sdk=appletvsimulator*]": x86_64
        FRAMEWORK_SEARCH_PATHS: "$(SRCROOT)/../core/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"
        OTHER_LDFLAGS: [-framework, SofaKingCore]
    preBuildScripts:
      - name: Build the Kotlin framework
        basedOnDependencyAnalysis: false
        script: |
          cd "$SRCROOT/.."
          ./gradlew :core:embedAndSignAppleFrameworkForXcode
  # The Top Shelf extension shows the recent channels; it reads them from the app group, so it needs no Kotlin framework.
  TopShelf:
    type: app-extension
    platform: tvOS
    sources: [TopShelf, SofaKingTV/TopShelfChannels.swift]
    configFiles:
      Debug: ../build/Version.xcconfig
      Release: ../build/Version.xcconfig
    info:
      path: TopShelf/Info.plist
      properties:
        CFBundleDisplayName: Sofa King
        NSExtension:
          NSExtensionPointIdentifier: com.apple.tv-top-shelf
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ContentProvider
        # Channel logos come from the server over plain HTTP, as in the app.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    entitlements:
      path: TopShelf/TopShelf.entitlements
      properties:
        com.apple.security.application-groups: [group.dev.jamesrich.sofaking]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.jamesrich.sofaking.tv.topshelf
