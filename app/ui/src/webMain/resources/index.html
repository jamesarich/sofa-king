<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="application-name" content="Sofa King">
    <meta name="description" content="Live TV, recordings and your own movies and shows from your Sofa King server">
    <meta name="color-scheme" content="dark">
    <meta name="theme-color" content="#14111F">
    <title>Sofa King</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="manifest" href="manifest.webmanifest">
    <style>
        html, body { margin: 0; height: 100%; overflow: hidden; background: #14111F; }
    </style>
    <script src="sofaking.js" defer></script>
    <script>
        // Makes the app installable and keeps its own files for a flaky network; see sw.js.
        if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
    </script>
</head>
<body></body>
</html>
