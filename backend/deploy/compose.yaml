name: sofa-king-backend

services:
  sofa-king-backend:
    # The published image for linux/amd64 and linux/arm64. SOFA_IMAGE in .env runs another, such as a local build;
    # compose.build.yaml builds one from a checkout. See docs/deploy.md#build.
    image: ${SOFA_IMAGE:-ghcr.io/jamesarich/sofa-king:main}
    container_name: sofa-king-backend
    restart: unless-stopped
    # Runs as the owner of ./config. 1000:1000 is the first user on most Linux hosts; otherwise set UID and GID
    # in .env to the output of `id -u` and `id -g`.
    user: "${UID:-1000}:${GID:-1000}"
    # The server writes only /config, /recordings and temporary files.
    read_only: true
    # exec: sqlite-jdbc loads its native library from the temporary directory.
    tmpfs:
      - /tmp:size=64m,exec
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # The heap is 75% of this limit; without one the JVM sizes it from the whole host.
    mem_limit: 4g
    pids_limit: 1024
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    # The host's network: the server listens on port 9193 of the host's own addresses, apps on the LAN find it over
    # mDNS, and the HDHomeRun tuners see each client's own address. SOFA_HDHR_EXTRA_PORTS listens on more host ports
    # the same way. Docker Desktop needs host networking turned on in its settings; see docs/deploy.md#host-networking.
    network_mode: host
    # Every variable in .env reaches the server, so ${NAME} references in sources.json resolve from it.
    env_file:
      - path: .env
        required: false
    environment:
      SOFA_PORT: ${SOFA_PORT:-9193}
      # Recordings go in their own folder, so they can live on a bigger disk than ./config; see docs/deploy.md#the-recordings-folder.
      SOFA_RECORDINGS_DIR: /recordings
      # Media libraries are added from this folder: uncomment the /media mount below. See docs/deploy.md#the-media-folder.
      SOFA_MEDIA_DIR: /media
      # Library conversions use the first GPU encoder that works once the GPU lines below are uncommented, else the CPU.
      SOFA_HWACCEL: ${SOFA_HWACCEL:-auto}
    volumes:
      # The database, the logo cache, the generated tokens, and sources.json and policy.json when you add them.
      - ./config:/config
      # Create it before the first start (mkdir config recordings), or point it at a bigger disk: /mnt/disk/recordings:/recordings.
      - ./recordings:/recordings
      # Your movies and shows, read only: the server never writes to them.
      # - /mnt/disk/media:/media:ro
    # An Intel or AMD GPU for converting library files; see docs/libraries.md#hardware-transcoding. Uncomment these and
    # store the render group's id first: printf 'RENDER_GID=%s\n' "$(stat -c %g /dev/dri/renderD128)" >> .env
    # devices:
    #   - /dev/dri:/dev/dri
    # group_add:
    #   - "${RENDER_GID:?set RENDER_GID in .env}"
    extra_hosts:
      # Lets sources.json reach a playlist or guide served by this Docker host as http://host.docker.internal:PORT/...
      - "host.docker.internal:host-gateway"
    stop_grace_period: 20s
    # A Homepage dashboard entry, see docs/deploy.md#homepage-dashboard.
    # labels:
    #   homepage.group: Media
    #   homepage.name: Sofa King
    #   homepage.icon: mdi-television-classic
    #   homepage.href: https://tv.example.com/admin
    #   homepage.description: Live TV
