# Every test and lifecycle method fails after a minute unless it carries its own @Timeout, so a hung test fails in
# a minute instead of holding the CI job until the job's own limit. It runs on a separate thread, so the run moves on
# even when the hung code ignores interrupts. A debugger session is never timed out.
junit.jupiter.execution.timeout.default = 60 s
junit.jupiter.execution.timeout.thread.mode.default = SEPARATE_THREAD
junit.jupiter.execution.timeout.mode = disabled_on_debug
