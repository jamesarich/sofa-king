org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.configuration-cache=true
org.gradle.configuration-cache.parallel=true
# Maven Central answers 429 to a burst of downloads from a shared runner; app/gradle.properties says how the retries back off.
systemProp.org.gradle.internal.repository.max.retries=8
systemProp.org.gradle.internal.repository.initial.backoff=1000
# Off, or an IDE sync can fail; the root gradle.properties says why.
org.gradle.tooling.parallel=false
# detekt in its own JVM per task; the sofaking.lint convention says why.
detekt.use.worker.api=true
# Apple targets build only on macOS; skip them quietly elsewhere.
kotlin.native.ignoreDisabledTargets=true
# Recompile only the changed Kotlin/Native sources (Beta; JetBrains plans to make it the default).
kotlin.incremental.native=true
kotlin.code.style=official
