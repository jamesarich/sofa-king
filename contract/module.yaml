product:
  type: kmp/lib
  platforms: [jvm, iosArm64, iosSimulatorArm64, macosArm64, tvosArm64, tvosSimulatorArm64, watchosArm64, watchosSimulatorArm64, linuxX64, linuxArm64, js, wasmJs]

dependencies:
  - $libs.kotlinx.serialization.core: exported

test-dependencies@jvm:
  - $libs.kotlinx.serialization.json

settings:
  kotlin:
    version: 2.5.0-RC
    serialization:
      enabled: true
      version: 1.13.0
  jvm:
    jdk:
      version: 21
    release: 17
