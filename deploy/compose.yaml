name: sofa-king-backend

services:
  sofa-king-backend:
    image: sofa-king-backend:local
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: sofa-king-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
      # One more HDHomeRun device per port listed in SOFA_HDHR_EXTRA_PORTS, see docs/live-tv.md#several-devices-for-a-large-lineup.
      # - "8081:8081"
      # - "8082:8082"
    env_file: .env
    environment:
      SOFA_API_TOKEN: ${SOFA_API_TOKEN:?set SOFA_API_TOKEN in deploy/.env}
      SOFA_SOURCES: /config/sources.json
      # Builds the lineup from a policy file, see docs/lineup-policy.md. The server writes it, so mount its directory read-write.
      # SOFA_POLICY: /config/policy/policy.json
    volumes:
      - sofa-data:/data
      - ./sources.json:/config/sources.json:ro
      # - ./policy:/config/policy
    extra_hosts:
      # Lets sources.json reach a feed served by this Docker host as http://host.docker.internal:PORT/...
      - "host.docker.internal:host-gateway"
    stop_grace_period: 20s

volumes:
  sofa-data:
