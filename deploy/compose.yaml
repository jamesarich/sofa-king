name: sofa-king-backend

services:
  sofa-king-backend:
    image: sofa-king-backend:local
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: sofa-king-backend
    restart: unless-stopped
    ports:
      - "9193:8080"
    env_file: .env
    environment:
      SOFA_API_TOKEN: ${SOFA_API_TOKEN:?set SOFA_API_TOKEN in deploy/.env}
      SOFA_SOURCES: /config/sources.json
    volumes:
      - sofa-data:/data
      - ./sources.json:/config/sources.json:ro
    extra_hosts:
      # Lets sources.json reach a feed served by this same host as http://host.docker.internal:PORT/...
      - "host.docker.internal:host-gateway"
    stop_grace_period: 20s

volumes:
  sofa-data:
