org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.configuration-cache=true
org.gradle.configuration-cache.parallel=true
# The remote build cache sits behind a home connection; app/gradle.properties says why stores need two minutes.
systemProp.org.gradle.internal.http.socketTimeout=120000
# Android Studio imports this composite; fetching its models in parallel realizes the same task containers from two
# threads and fails the sync with a ConcurrentModificationException. Gradle infers true from org.gradle.parallel.
org.gradle.tooling.parallel=false
