org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=true
android.useAndroidX=true
kotlin.code.style=official
# The app version on every platform: Android versionName, the desktop package and the About row.
sofaking.version=0.1.0
# Snapshot builds override these with -P: the run number, and a suffix such as -dev.42+abc1234 that Android's
# versionName and the About row append. The desktop package keeps the numeric version jpackage requires.
sofaking.versionCode=1
sofaking.versionSuffix=
