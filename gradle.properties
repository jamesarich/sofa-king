# Android Studio and IntelliJ IDEA read this file when they open the repository root (the composite in
# settings.gradle.kts); builds run from app/, backend/ or contract/ read their own.
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.configuration-cache=true
org.gradle.configuration-cache.parallel=true
# The remote build cache sits behind a home connection; app/gradle.properties says why stores need two minutes.
systemProp.org.gradle.internal.http.socketTimeout=120000

# Off: with parallel tool model building, Android Studio builds each project's model on its own thread, the Kotlin
# plugin's web setup creates tasks in every project from whichever thread gets there, and Gradle's task container threw
# ConcurrentModificationException ("Could not create task ':app:core:jsTest'") and failed the sync. Command-line builds
# never build tooling models, so this only slows a sync.
org.gradle.tooling.parallel=false
