# The server packages not yet refactored to these rules (see gradle/detekt.yml), main and test sources alike. Each
# package leaves its lists in the pull request that refactors it, and this file goes with the last one.
complexity:
  LongMethod:
    excludes: ['**/admin/**', '**/http/**']
  LargeClass:
    excludes: ['**/admin/**', '**/http/**']
  TooManyFunctions:
    # The tests stay excluded as gradle/detekt.yml has them, since these excludes replace those.
    excludes: ['**/*Test/**', '**/test/**', '**/admin/**', '**/http/**']
  CyclomaticComplexMethod:
    excludes: ['**/admin/**', '**/http/**']

style:
  ReturnCount:
    excludes: ['**/admin/**', '**/http/**']
  ThrowsCount:
    excludes: ['**/admin/**', '**/http/**']
