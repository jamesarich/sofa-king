# The server packages not yet refactored to these rules (see gradle/detekt.yml), main and test sources alike. Each
# package leaves its lists in the pull request that refactors it, and this file goes with the last one.
complexity:
  LongMethod:
    excludes: ['**/admin/**', '**/http/**', '**/library/**', '**/playback/**']
  LargeClass:
    excludes: ['**/admin/**', '**/http/**']
  NestedBlockDepth:
    excludes: ['**/library/**']
  TooManyFunctions:
    # The tests stay excluded as gradle/detekt.yml has them, since these excludes replace those.
    excludes:
      ['**/*Test/**', '**/test/**', '**/admin/**', '**/http/**', '**/library/**', '**/playback/**']
  CyclomaticComplexMethod:
    excludes: ['**/admin/**', '**/http/**', '**/library/**', '**/playback/**']

style:
  LoopWithTooManyJumpStatements:
    excludes: ['**/library/**', '**/playback/**']
  ReturnCount:
    excludes: ['**/admin/**', '**/http/**', '**/library/**', '**/playback/**']
  ThrowsCount:
    excludes: ['**/admin/**', '**/http/**', '**/library/**']
