# detekt's settings for every Kotlin project, on top of its defaults (the sofaking.lint convention in build-logic). Only
# what differs from the defaults is here; each change says why.

# The defaults skip test code for some rules by the usual test source set names. This repository also has androidHostTest,
# fileTest, tvosTest and screenshotTest, so every source set whose name ends in Test is skipped instead.
complexity:
  TooManyFunctions:
    excludes: &tests ['**/*Test/**', '**/test/**']
    # detekt's Compose guidance: previews add no complexity.
    ignoreAnnotatedFunctions: ['Preview']
  CyclomaticComplexMethod:
    # A when that maps each case to one value is a table, not branching logic.
    ignoreSimpleWhenEntries: true

naming:
  FunctionNaming:
    excludes: *tests
    # detekt's Compose guidance: composables that emit UI are named like types.
    ignoreAnnotated: ['Composable']

style:
  MagicNumber:
    excludes: ['**/*Test/**', '**/test/**', '**/*.kts'] # the tests, as above, and the Gradle scripts
  ReturnCount:
    # A guard clause (`?: return`, `if (...) return` at the top) is the idiomatic Kotlin early exit, not extra exits.
    excludeGuardClauses: true
  ThrowsCount:
    excludeGuardClauses: true
  UnusedPrivateFunction:
    # detekt's Compose guidance: previews are used by the IDE and the screenshot tests, not by code.
    ignoreAnnotated: ['Preview']

# The Compose rules (io.nlopez.compose.rules).
Compose:
  CompositionLocalAllowlist:
    # The app's own CompositionLocals, each an ambient value that nearly every screen reads and nothing passes by hand:
    # the window's layout profile, last input, full screen and picture-in-picture; the clock, zone and clock format that
    # previews and screenshot tests pin; the app's lifecycle; the guide's density; and the player volume. A new one has
    # to be added here, which is the rule's point.
    allowedCompositionLocals:
      - LocalLayoutProfile
      - LocalLastInput
      - LocalAppLifecycleOwner
      - LocalClock
      - LocalWindowFullScreen
      - LocalInPictureInPicture
      - LocalClockFormat
      - LocalTimeZone
      - LocalGuideDensity
      - LocalPlayerVolume
  ViewModelForwarding:
    # The shell hands its ViewModels to one destination per route (LiveDestinations.kt and the rest), and the
    # destination is where state is hoisted: it collects the state and passes values and callbacks to stateless screens.
    allowedForwarding:
      - '.*Destination'
