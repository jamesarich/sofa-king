lifecycle-viewmodel-navigation3 = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel-navigation3", version.ref = "lifecycle-multiplatform" }
kermit = { module = "co.touchlab:kermit", version.ref = "kermit" }

# Compose Multiplatform
