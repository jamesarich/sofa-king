# The one version catalog for the app, the server, the contract and build-logic. Each build loads it from its
# settings.gradle.kts, so a Kotlin or kotlinx.serialization bump moves all of them at once.
[versions]
# The one version of Sofa King: the app on every platform (About row, Android versionName, the desktop packages, the
# Swift hosts' MARKETING_VERSION), the contract and the server's jars.
sofaking = "0.1.0"
agp = "9.5.0-rc02"
kotlin = "2.5.0-Beta2"
compose-multiplatform = "1.13.0-beta01"
# Compose bundles an older Hot Reload plugin that still calls a Gradle API removed in Gradle 10; this one is clean.
compose-hot-reload = "1.3.0-beta02"
# The window size classes; its own track, released alongside Compose Multiplatform.
compose-material3-adaptive = "1.4.0-alpha01"
# The core icon set is published apart from the rest of Compose Multiplatform and stopped at 1.7.3. The extended set
# is not used: the Kotlin/JS production build spent over twenty minutes minifying it (PlayerIcons.kt holds the rest).
compose-material-icons = "1.7.3"
coroutines = "1.11.0"
serialization = "1.12.0"
ktor = "3.6.1"
okhttp = "5.5.1"
kotlinx-io = "0.9.1"
kotlinx-datetime = "0.8.0"
kotlinx-html = "0.12.0"
okio = "3.18.2"
kotlinx-browser = "0.5.0"
datastore = "1.3.0"
lifecycle-multiplatform = "2.11.0"
navigationevent = "1.1.0"
# JetBrains' multiplatform Navigation 3 UI; it brings Google's navigation3-runtime, which publishes every target itself.
navigation3 = "1.2.0"
kermit = "2.2.0"
activity-compose = "1.14.0-alpha03"
androidx-core = "1.19.1"
# The launch screen the system draws until the first page is ready, on every API level the app runs on.
core-splashscreen = "1.2.0"
core-pip = "1.0.0-alpha04"
media3 = "1.11.1"
profileinstaller = "1.4.1"
tvprovider = "1.1.0"
# Google TV's Continue watching row (the Engage SDK), which replaces the Watch Next API that tvprovider writes.
engage-tv = "1.1.0"
# Play services (through engage-tv) brings Fragment 1.1.0, whose activity results lint refuses; this raises it.
androidx-fragment = "1.9.1"
# engage-tv brings WorkManager 2.7.0 and Room 2.2.5, whose R8 rules drop WorkDatabase_Impl's constructor, so a minified
# build crashes at launch when WorkManager starts; this raises both.
androidx-work = "2.12.0"
# Macrobenchmark and the Baseline Profile plugin release together.
benchmark = "1.5.0"
uiautomator = "2.4.0"
androidx-test-junit = "1.3.0"
androidx-test-runner = "1.7.0"
androidx-test-orchestrator = "1.6.1"
# Compose Preview Screenshot Testing's engine and validation API, run by the androidApp screenshot test suite.
screenshot = "0.0.1-alpha16"
vlcj = "4.12.1"
# The desktop app's MPRIS media session on Linux, over the session bus.
dbus-java = "5.2.2"
coil = "3.6.3"
# The open-source licenses screen: its Gradle plugin lists the dependencies at build time, its Compose UI draws them.
aboutlibraries = "15.3.0"
exposed = "1.6.0"
sqlite = "3.53.4.0"
logback = "1.6.6"
zxing = "3.5.4"
jmdns = "3.6.4"
# The official Model Context Protocol SDK the server answers /api/v1/mcp with.
mcp = "0.16.0"
# The server's tests: JUnit Jupiter and the launcher Gradle runs it with.
junit = "6.1.3"
# Lint (the sofaking.lint convention): Spotless runs ktlint to format, detekt analyzes with the Compose rules added.
spotless = "8.10.4"
ktlint = "1.8.0"
detekt = "2.0.0-alpha.6"
# Built against the detekt above; a detekt bump waits for a Compose rules release that matches it.
compose-rules = "0.6.8"

[libraries]
# Shared
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-swing = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-swing", version.ref = "coroutines" }
