# What the server and the contract share under the Kotlin Toolchain. A module file cannot read the versions in
# gradle/libs.versions.toml, so the two below repeat the catalog's `kotlin` and `serialization` pins, and Renovate moves
# them in the same pull request as the catalog (renovate.json).
settings:
  kotlin:
    # A compiler warning fails the build, as sofaking.warningsAsErrors does for the app: fix it or opt in to the API it names.
    allWarningsAsErrors: true
    # renovate: datasource=maven depName=org.jetbrains.kotlin:kotlin-stdlib
    version: 2.5.0-RC
    serialization:
      enabled: true
      # renovate: datasource=maven depName=org.jetbrains.kotlinx:kotlinx-serialization-core
      version: 1.13.0
